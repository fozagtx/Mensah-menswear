<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Mensah Miro user-flow board preview</title>
  <desc id="desc">A preview diagram of the Mensah storefront flow from first visit personalization through API-backed browsing, checkout, basket creation, and WhatsApp redirect.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f0; }
      .lane { fill: #fffdf8; stroke: #ded6c8; stroke-width: 1; }
      .lane-title { fill: #1e1c1a; font: 700 16px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node { fill: #ffffff; stroke: #d2c6b5; stroke-width: 1.5; rx: 10; }
      .api { fill: #eef3e9; stroke: #67785d; }
      .decision { fill: #e4c982; stroke: #8c7334; }
      .action { fill: #b48970; stroke: #845f4b; }
      .end { fill: #1e3125; stroke: #1e3125; }
      .text { fill: #302d28; font: 500 14px ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #746e67; font: 400 12px ui-sans-serif, system-ui, sans-serif; }
      .white { fill: #ffffff; }
      .arrow { stroke: #b8ac9d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 5; }
      .motif { fill: none; stroke: #67785d; stroke-width: 2; opacity: .22; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8ac9d" />
    </marker>
  </defs>
  <rect class="bg" width="1440" height="620" />
  <path class="motif" d="M58 56c22-22 44-22 66 0-22 22-44 22-66 0Zm33-33v66M1288 518c22-22 44-22 66 0-22 22-44 22-66 0Zm33-33v66" />
  <text x="48" y="44" class="lane-title">MENSAH STOREFRONT USER FLOW</text>
  <text x="48" y="68" class="small">Miro planning board preview • API merchant id: mensah • WhatsApp fallback: +233500861334</text>

  <rect x="40" y="105" width="1360" height="82" class="lane" />
  <text x="60" y="136" class="lane-title">USER</text>
  <rect x="190" y="123" width="145" height="44" class="node" />
  <text x="213" y="150" class="text">First visit</text>
  <rect x="420" y="123" width="172" height="44" class="node" />
  <text x="440" y="142" class="text">Pick preference</text>
  <text x="440" y="158" class="small">Party / Summer / Beach</text>
  <rect x="1112" y="123" width="150" height="44" class="node" />
  <text x="1133" y="150" class="text">Review cart</text>

  <rect x="40" y="205" width="1360" height="120" class="lane" />
  <text x="60" y="236" class="lane-title">STOREFRONT UI</text>
  <rect x="190" y="245" width="145" height="48" class="node" />
  <text x="212" y="265" class="text">Landing page</text>
  <text x="212" y="281" class="small">Hero + collection</text>
  <polygon points="492,232 560,266 492,300 424,266" class="decision" />
  <text x="460" y="262" class="text">Preference</text>
  <text x="475" y="278" class="text">saved?</text>
  <rect x="650" y="245" width="160" height="48" class="node" />
  <text x="670" y="265" class="text">Style library</text>
  <text x="670" y="281" class="small">Search + filters</text>
  <rect x="910" y="245" width="158" height="48" class="node" />
  <text x="933" y="265" class="text">Quick view</text>
  <text x="933" y="281" class="small">Image, price, add</text>
  <rect x="1112" y="245" width="150" height="48" class="action" />
  <text x="1142" y="274" class="white text">Add to cart</text>

  <rect x="40" y="342" width="1360" height="94" class="lane" />
  <text x="60" y="374" class="lane-title">HACKATHON MERCHANT API</text>
  <rect x="190" y="368" width="165" height="44" class="api" />
  <text x="211" y="395" class="text">GET /merchants/mensah</text>
  <rect x="650" y="368" width="180" height="44" class="api" />
  <text x="673" y="395" class="text">GET /mensah/items</text>
  <polygon points="1000,356 1068,390 1000,424 932,390" class="decision" />
  <text x="964" y="386" class="text">Campaigns</text>
  <text x="978" y="402" class="text">exist?</text>

  <rect x="40" y="454" width="1360" height="78" class="lane" />
  <text x="60" y="486" class="lane-title">CART / CHECKOUT</text>
  <rect x="850" y="472" width="150" height="42" class="node" />
  <text x="877" y="499" class="text">Checkout form</text>
  <rect x="1090" y="472" width="172" height="42" class="api" />
  <text x="1110" y="499" class="text">POST /baskets</text>
  <polygon points="1320,458 1378,493 1320,528 1262,493" class="decision" />
  <text x="1287" y="490" class="text">Created?</text>

  <rect x="40" y="550" width="1360" height="48" class="lane" />
  <text x="60" y="580" class="lane-title">WHATSAPP</text>
  <rect x="850" y="557" width="170" height="32" class="node" />
  <text x="871" y="578" class="text">Build order message</text>
  <rect x="1090" y="557" width="172" height="32" class="end" />
  <text x="1115" y="578" class="white text">Redirect to WhatsApp</text>

  <path class="arrow" d="M335 145H420" />
  <path class="arrow" d="M506 167v64" />
  <path class="arrow" d="M560 266H650" />
  <path class="arrow" d="M810 269H910" />
  <path class="arrow" d="M1068 269H1112" />
  <path class="arrow" d="M1187 293v179" />
  <path class="arrow" d="M1000 472H1090" />
  <path class="arrow" d="M1262 493h0" />
  <path class="arrow" d="M1176 514v43" />
  <path class="arrow" d="M1020 573H1090" />
  <path class="arrow dash" d="M262 245v-58" />
  <path class="arrow dash" d="M730 293v75" />
  <path class="arrow dash" d="M988 293v63" />
</svg>
